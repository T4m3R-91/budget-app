<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Household Budget</title>
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="offline-banner" class="banner" role="status" hidden>You're offline. Connect to the internet to save entries.</div>

  <main>
    <section id="screen-boot" class="screen center-screen">
      <p class="muted" id="boot-message">Loading…</p>
    </section>

    <section id="screen-setup" class="screen center-screen" hidden>
      <div class="card-plain">
        <h1>Almost there</h1>
        <p>The app isn't connected to your database yet. Open <code>config.js</code> and paste in your Supabase URL and publishable key, then upload it again.</p>
      </div>
    </section>

    <section id="screen-login" class="screen center-screen" hidden></section>
    <section id="screen-notmember" class="screen center-screen" hidden></section>
    <section id="screen-add" class="screen" hidden></section>
    <section id="screen-history" class="screen" hidden></section>
    <section id="screen-dashboard" class="screen wide" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
  </main>

  <nav id="tabbar" aria-label="Main" hidden>
    <a href="#add" data-tab="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      <span>Add</span>
    </a>
    <a href="#history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
      <span>History</span>
    </a>
    <a href="#dashboard" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6" /></svg>
      <span>Dashboard</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    // If the app's code never starts (e.g. no connection while loading), say so instead of hanging.
    setTimeout(function () {
      if (!window.__appStarted) {
        document.getElementById("boot-message").textContent =
          "The app couldn't load. Check your internet connection, then reload.";
      }
    }, 12000);
  </script>
</body>
</html>
